services:
  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_DATABASE=awbd
      - MONGO_INITDB_ROOT_PASSWORD=awbd
      - MONGO_INITDB_ROOT_USERNAME=awbd
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=awbd
      - POSTGRES_PASSWORD=awbd
      - POSTGRES_USER=awbd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  mongodb_data:
  postgres_data: