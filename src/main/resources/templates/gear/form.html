<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Gear form')}"></head>
<body>
<nav th:replace="~{fragments/layout :: mainNav}"></nav>
<main class="container py-4">
    <h1 class="h3 mb-3" th:text="${editId != null} ? 'Edit gear item' : 'New gear item'">Gear</h1>

    <form th:action="${editId != null} ? @{/gear/{id}(id=${editId})} : @{/gear}"
          th:object="${form}" method="post" class="needs-validation" novalidate>
        <div class="mb-3">
            <label class="form-label" for="type">Type *</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'"
                    id="type" th:field="*{type}" required>
                <option value="">-- select --</option>
                <option th:each="t : ${gearTypes}" th:value="${t}" th:text="${t}">TYPE</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">err</div>
        </div>
        <div class="row">
            <div class="mb-3 col-md-6">
                <label class="form-label" for="brand">Brand *</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'"
                       id="brand" type="text" th:field="*{brand}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}">err</div>
            </div>
            <div class="mb-3 col-md-6">
                <label class="form-label" for="model">Model *</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('model')} ? 'is-invalid'"
                       id="model" type="text" th:field="*{model}" required>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}">err</div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="ownerId">Owner *</label>
            <select class="form-select" th:classappend="${#fields.hasErrors('ownerId')} ? 'is-invalid'"
                    id="ownerId" th:field="*{ownerId}" required>
                <option value="">-- select --</option>
                <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}">user</option>
            </select>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('ownerId')}" th:errors="*{ownerId}">err</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="notes">Notes</label>
            <textarea class="form-control" id="notes" rows="3" th:field="*{notes}" maxlength="1000"></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/gear}">Cancel</a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    (function () {
        document.querySelectorAll('.needs-validation').forEach(function (f) {
            f.addEventListener('submit', function (e) {
                if (!f.checkValidity()) { e.preventDefault(); e.stopPropagation(); }
                f.classList.add('was-validated');
            });
        });
    })();
</script>
</body>
</html>
