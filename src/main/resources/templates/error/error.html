<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<nav th:replace="~{fragments/layout :: mainNav}"></nav>
<main class="container py-5 text-center">
    <h1 class="display-4 text-danger" th:text="${status} ?: 'Error'">Error</h1>
    <h2 class="mb-3" th:text="${error} ?: 'Something went wrong'">Something went wrong</h2>
    <p class="lead text-muted" th:text="${message}">Details</p>
    <a class="btn btn-primary mt-3" th:href="@{/}">Back to dashboard</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
